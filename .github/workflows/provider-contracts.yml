name: Nightly provider contracts

on:
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * *'

permissions:
  contents: read

jobs:
  deepseek-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Real API contract probes
        run: python -m pytest tests/test_provider_contracts.py -m provider_live -v --tb=short --assert=plain
        env:
          APP_ENV: test
          RUN_PROVIDER_LIVE: '1'
          LLM_BASE_URL: https://api.deepseek.com
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL_AGENT: deepseek-flash
          LLM_MODEL_ROUTER: deepseek-flash
